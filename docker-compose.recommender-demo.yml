services:
  backend:
    environment:
      APP_ENV: dev
      ENV: dev
      LOCAL_CONFIG_PATH: /config/dev.yaml
      DEV_USER_ROLE: ${DEV_USER_ROLE:-admin}

  frontend:
    build:
      target: dev
    command: npm run dev -- -H 0.0.0.0
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      SERVER_API_URL: ${SERVER_API_URL:-http://backend:8888}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_APP_MODE: dev
    depends_on:
      backend:
        condition: service_healthy
      recommender-demo-generate:
        condition: service_completed_successfully

  recommender-demo-seed:
    build:
      context: ./apps/recommender
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      CLICKHOUSE_HTTP_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
      CLICKHOUSE_DB: papaya_analytics
      RECOMMENDER_MODEL_VERSION: demo-synthetic-v1
      RECOMMENDER_ARTIFACTS_DIR: /app/apps/recommender/artifacts
      RECOMMENDER_MODEL_TYPE: ${RECOMMENDER_MODEL_TYPE:-catboost_ranker}
      RECOMMENDER_CONTENT_ENABLED: ${RECOMMENDER_CONTENT_ENABLED:-true}
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./apps/recommender/artifacts:/app/apps/recommender/artifacts
      - ./recommendation-model-report.md:/app/recommendation-model-report.md
    depends_on:
      backend:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
    command:
      [
        "uv",
        "run",
        "python",
        "-m",
        "recommender.synthetic_loader",
        "--dataset-id",
        "recommender-demo",
        "--run-id",
        "recommender-demo-seed",
        "--validate"
      ]
    restart: "no"

  recommender-demo-train:
    build:
      context: ./apps/recommender
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      CLICKHOUSE_HTTP_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
      CLICKHOUSE_DB: papaya_analytics
      RECOMMENDER_MODEL_VERSION: demo-synthetic-v1
      RECOMMENDER_ARTIFACTS_DIR: /app/apps/recommender/artifacts
      RECOMMENDER_MODEL_TYPE: ${RECOMMENDER_MODEL_TYPE:-catboost_ranker}
      RECOMMENDER_CONTENT_ENABLED: ${RECOMMENDER_CONTENT_ENABLED:-true}
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./apps/recommender/artifacts:/app/apps/recommender/artifacts
    depends_on:
      recommender-demo-seed:
        condition: service_completed_successfully
    command: ["uv", "run", "python", "-m", "recommender.train_model", "--events-days", "180", "--metrics-k", "10"]
    restart: "no"

  recommender-demo-generate:
    build:
      context: ./apps/recommender
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      CLICKHOUSE_HTTP_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
      CLICKHOUSE_DB: papaya_analytics
      RECOMMENDER_MODEL_VERSION: demo-synthetic-v1
      RECOMMENDER_ARTIFACTS_DIR: /app/apps/recommender/artifacts
      RECOMMENDER_MODEL_TYPE: ${RECOMMENDER_MODEL_TYPE:-catboost_ranker}
      RECOMMENDER_CONTENT_ENABLED: ${RECOMMENDER_CONTENT_ENABLED:-true}
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./apps/recommender/artifacts:/app/apps/recommender/artifacts
    depends_on:
      recommender-demo-train:
        condition: service_completed_successfully
    command: ["uv", "run", "python", "-m", "recommender.generate_recommendations", "--events-days", "180"]
    restart: "no"

  recommender-demo-refresh:
    profiles: ["demo-tools"]
    build:
      context: ./apps/recommender
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      CLICKHOUSE_HTTP_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
      CLICKHOUSE_DB: papaya_analytics
      RECOMMENDER_MODEL_VERSION: demo-synthetic-v1
      RECOMMENDER_ARTIFACTS_DIR: /app/apps/recommender/artifacts
      RECOMMENDER_MODEL_TYPE: ${RECOMMENDER_MODEL_TYPE:-catboost_ranker}
      RECOMMENDER_CONTENT_ENABLED: ${RECOMMENDER_CONTENT_ENABLED:-true}
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./apps/recommender/artifacts:/app/apps/recommender/artifacts
    depends_on:
      backend:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
    command:
      [
        "sh",
        "-lc",
        "uv run python -m recommender.train_model --events-days 180 --metrics-k 10 && uv run python -m recommender.generate_recommendations --events-days 180"
      ]
    restart: "no"

  recommender-demo-report:
    build:
      context: ./apps/recommender
      dockerfile: Dockerfile
    environment:
      RECOMMENDER_MODEL_VERSION: demo-synthetic-v1
      RECOMMENDER_ARTIFACTS_DIR: /app/apps/recommender/artifacts
      RECOMMENDER_CONTENT_ENABLED: ${RECOMMENDER_CONTENT_ENABLED:-true}
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./apps/recommender/artifacts:/app/apps/recommender/artifacts
    depends_on:
      recommender-demo-generate:
        condition: service_completed_successfully
    command:
      [
        "uv",
        "run",
        "python",
        "-m",
        "recommender.reporting",
        "--output",
        "/app/recommendation-model-report.md"
      ]
    restart: "no"

  recommender-demo-clean:
    profiles: ["demo-tools"]
    build:
      context: ./apps/recommender
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      CLICKHOUSE_HTTP_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
      CLICKHOUSE_DB: papaya_analytics
      RECOMMENDER_MODEL_VERSION: demo-synthetic-v1
      OPENBLAS_NUM_THREADS: "1"
    depends_on:
      backend:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
    command:
      [
        "uv",
        "run",
        "python",
        "-m",
        "recommender.synthetic_loader",
        "--dataset-id",
        "recommender-demo",
        "--run-id",
        "recommender-demo-seed",
        "--clear-only"
      ]
    restart: "no"
