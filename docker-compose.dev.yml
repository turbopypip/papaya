services:
  backend:
    volumes:
      - ./apps/backend/app/config:/config:ro
      - ./apps/backend/uploads:/uploads

  frontend:
    build:
      target: dev
    command: npm run dev -- -H 0.0.0.0
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      SERVER_API_URL: ${SERVER_API_URL:-http://backend:8888}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
