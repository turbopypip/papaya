services:
  backend:
    volumes:
      - ./apps/backend/app/config:/config:ro
      - ./apps/backend/uploads:/uploads
    environment:
      APP_ENV: dev
      ENV: dev
      LOCAL_CONFIG_PATH: /config/dev.yaml
      DEV_USER_ROLE: ${DEV_USER_ROLE:-admin}

  frontend:
    build:
      target: dev
    command: npm run dev -- -H 0.0.0.0
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      SERVER_API_URL: ${SERVER_API_URL:-http://backend:8888}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_APP_MODE: dev
