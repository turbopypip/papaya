services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: prod
      ENV: prod
      LOCAL_CONFIG_PATH: /config/prod.yaml
      CLICKHOUSE_ENABLED: ${CLICKHOUSE_ENABLED:-true}
      CLICKHOUSE_ADDRESS: ${CLICKHOUSE_ADDRESS:-clickhouse:9000}
      CLICKHOUSE_DB: papaya_analytics
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-papaya}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-papaya_analytics_password}
      RECOMMENDER_SERVICE_URL: ${RECOMMENDER_SERVICE_URL:-http://recommender-service:8000}
    volumes:
      - ./apps/backend/app/config:/config:ro
      - ./apps/backend/uploads:/uploads
    ports:
      - "8888:8888"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
      recommender-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8888/api/v1/ping | grep -q pong"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        SERVER_API_URL: ${SERVER_API_URL:-http://backend:8888}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8888}
        NEXT_PUBLIC_APP_MODE: prod
    environment:
      SERVER_API_URL: ${SERVER_API_URL:-http://backend:8888}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8888}
      NEXT_PUBLIC_APP_MODE: prod
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -p $${PG_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: papaya_analytics
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-papaya}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-papaya_analytics_password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --host 127.0.0.1 --user $${CLICKHOUSE_USER} --password $${CLICKHOUSE_PASSWORD} --query 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  clickhouse-migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./apps/backend/app/migrations/clickhouse:/migrations:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    command:
      [
        "-path=/migrations",
        "-database=clickhouse://clickhouse:9000?username=${CLICKHOUSE_USER:-papaya}&password=${CLICKHOUSE_PASSWORD:-papaya_analytics_password}",
        "up"
      ]
    restart: "no"

  recommender-service:
    build:
      context: ./apps/recommender
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      CLICKHOUSE_HTTP_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
      CLICKHOUSE_DB: papaya_analytics
      RECOMMENDER_ARTIFACTS_DIR: /app/apps/recommender/artifacts
      RECOMMENDER_MODEL_TYPE: ${RECOMMENDER_MODEL_TYPE:-winner}
      RECOMMENDER_CONTENT_ENABLED: ${RECOMMENDER_CONTENT_ENABLED:-true}
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./apps/recommender/artifacts:/app/apps/recommender/artifacts
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
    command: ["uv", "run", "python", "-m", "recommender.api", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  recommender-train:
    profiles: ["jobs"]
    build:
      context: ./apps/recommender
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      CLICKHOUSE_HTTP_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
      CLICKHOUSE_DB: papaya_analytics
      RECOMMENDER_ARTIFACTS_DIR: /app/apps/recommender/artifacts
      RECOMMENDER_MODEL_TYPE: ${RECOMMENDER_MODEL_TYPE:-winner}
      RECOMMENDER_CONTENT_ENABLED: ${RECOMMENDER_CONTENT_ENABLED:-true}
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./apps/recommender/artifacts:/app/apps/recommender/artifacts
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
    command: ["uv", "run", "python", "-m", "recommender.train_model"]
    restart: "no"

  recommender-generate:
    profiles: ["jobs"]
    build:
      context: ./apps/recommender
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      CLICKHOUSE_HTTP_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
      CLICKHOUSE_DB: papaya_analytics
      RECOMMENDER_ARTIFACTS_DIR: /app/apps/recommender/artifacts
      RECOMMENDER_MODEL_TYPE: ${RECOMMENDER_MODEL_TYPE:-winner}
      RECOMMENDER_CONTENT_ENABLED: ${RECOMMENDER_CONTENT_ENABLED:-true}
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./apps/recommender/artifacts:/app/apps/recommender/artifacts
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
    command: ["uv", "run", "python", "-m", "recommender.generate_recommendations"]
    restart: "no"

volumes:
  pgdata:
  redis_data:
  clickhouse_data:
